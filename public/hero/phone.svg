<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 560" fill="none" font-family="Inter, Arial, sans-serif">
  <defs>
    <filter id="drop" x="-30%" y="-10%" width="160%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b5563"/><stop offset=".5" stop-color="#111827"/><stop offset="1" stop-color="#374151"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
